[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
# jpeg-encoder ports libjpeg code under the permissive IJG license, which asks
# only for attribution in documentation. Allowed for that crate alone.
exceptions = [{ allow = ["IJG"], crate = "jpeg-encoder" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
