syntax = "proto3";

package agentcomp.agentd.v1;

option go_package = "github.com/mondeep31/agent-comp/gen/go/agentcomp/agentd/v1;agentdv1";

// Wire format between the host (acd) and the guest agent (agentd) over vsock.
//
// Every message on a connection is a Frame, prefixed with its encoded length
// as a big-endian uint32 (max 4 MiB). A connection carries exactly one
// operation: the host sends the opening frame, then both sides exchange the
// frames that operation defines. Any side may send Error and close.
//
// Operations:
//   Ping:      host Ping                    -> guest Pong
//   Exec:      host ExecStart, ExecStdin*, ExecSignal*
//                                          -> guest ExecOutput*, ExecExit
//   ReadFile:  host ReadFile                -> guest FileInfo, FileData* (last has eof)
//   WriteFile: host WriteFile, FileData* (last has eof)
//                                          -> guest FileInfo
//   Stat:      host Stat                    -> guest FileInfo
//   ListDir:   host ListDir                 -> guest DirListing
//   Configure: host Configure               -> guest Ack
//   Screenshot: host Screenshot             -> guest ScreenshotInfo, FileData* (last has eof)
//   Input:     host Input                   -> guest InputResult
//
// Screenshot and Input need a display; a headless guest, or one whose
// display is not ready, answers ERROR_CODE_UNAVAILABLE.
message Frame {
  oneof kind {
    Error error = 1;
    Ping ping = 2;
    Pong pong = 3;
    ExecStart exec_start = 4;
    ExecStdin exec_stdin = 5;
    ExecSignal exec_signal = 6;
    ExecOutput exec_output = 7;
    ExecExit exec_exit = 8;
    ReadFile read_file = 9;
    WriteFile write_file = 10;
    FileData file_data = 11;
    FileInfo file_info = 12;
    Stat stat = 13;
    ListDir list_dir = 14;
    DirListing dir_listing = 15;
    Configure configure = 16;
    Ack ack = 17;
    Screenshot screenshot = 18;
    ScreenshotInfo screenshot_info = 19;
    Input input = 20;
    InputResult input_result = 21;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_TOO_LARGE = 5;
  ERROR_CODE_INTERNAL = 6;
  // The operation needs something the guest does not have right now, such
  // as a display that is still starting or has crashed.
  ERROR_CODE_UNAVAILABLE = 7;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message Ping {}

message Pong {
  string agent_version = 1;
  uint64 uptime_ms = 2;
  // Set when the guest was booted with a display (ac.display=WxH).
  Display display = 3;
}

// The guest's virtual screen.
message Display {
  uint32 width = 1;
  uint32 height = 2;
  // True once the X server is up and the desktop session reports ready.
  bool ready = 3;
  // Why the display is not ready, when it failed.
  string error = 4;
}

message ExecStart {
  // argv[0] is resolved through PATH. Use ["/bin/sh", "-c", cmd] for shell syntax.
  repeated string argv = 1;
  map<string, string> env = 2;
  string cwd = 3;
  // 0 means no timeout.
  uint32 timeout_ms = 4;
  // When false, the process gets /dev/null as stdin.
  bool stdin = 5;
}

message ExecStdin {
  bytes data = 1;
  bool eof = 2;
}

message ExecSignal {
  // POSIX signal number, delivered to the whole process group.
  int32 signal = 1;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message ExecOutput {
  Stream stream = 1;
  bytes data = 2;
}

message ExecExit {
  // Exit code when the process exited normally, -1 otherwise.
  int32 exit_code = 1;
  // Terminating signal, 0 if none.
  int32 signal = 2;
  bool timed_out = 3;
  uint64 duration_ms = 4;
}

message ReadFile {
  string path = 1;
  // 0 means the agent default limit.
  uint64 max_bytes = 2;
}

message WriteFile {
  string path = 1;
  // Permission bits for a newly created file; 0 means 0644.
  uint32 mode = 2;
  bool create_parents = 3;
  bool append = 4;
}

message FileData {
  bytes data = 1;
  bool eof = 2;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIR = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message FileInfo {
  string path = 1;
  string name = 2;
  FileType type = 3;
  uint64 size = 4;
  uint32 mode = 5;
  int64 mtime_unix_ms = 6;
}

message Stat {
  string path = 1;
}

message ListDir {
  string path = 1;
}

message DirListing {
  repeated FileInfo entries = 1;
}

message NetworkConfig {
  string interface = 1;
  // e.g. "10.200.0.2/30"
  string address_cidr = 2;
  string gateway = 3;
  repeated string nameservers = 4;
}

// Sent after boot and after every snapshot restore so restored clones diverge.
message Configure {
  string hostname = 1;
  int64 wall_clock_unix_ms = 2;
  // Mixed into the guest entropy pool.
  bytes entropy = 3;
  NetworkConfig network = 4;
  // Default environment for subsequent Exec calls.
  map<string, string> env = 5;
}

message Ack {}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_PNG = 1;
  IMAGE_FORMAT_JPEG = 2;
}

// A rectangle in screen pixels.
message Region {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message Screenshot {
  // Unspecified means PNG.
  ImageFormat format = 1;
  // JPEG quality 1-100; 0 means 80.
  uint32 quality = 2;
  // Captures part of the screen; unset means all of it.
  Region region = 3;
}

// Precedes the encoded image, which follows as FileData chunks.
message ScreenshotInfo {
  uint32 width = 1;
  uint32 height = 2;
  ImageFormat format = 3;
  uint64 size = 4;
}

// A batch of input events, applied in order. Keys and buttons still held at
// the end of a batch, or when an event fails, are released, unless they were
// pressed with ACTION_PRESS and the batch ended normally.
message Input {
  repeated InputEvent events = 1;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  // Press and release (click or tap).
  ACTION_TAP = 1;
  ACTION_PRESS = 2;
  ACTION_RELEASE = 3;
}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_MIDDLE = 2;
  BUTTON_RIGHT = 3;
}

message InputEvent {
  oneof kind {
    PointerMove move = 1;
    PointerButton button = 2;
    Scroll scroll = 3;
    Key key = 4;
    Text text = 5;
    Delay delay = 6;
  }
}

message PointerMove {
  int32 x = 1;
  int32 y = 2;
}

message PointerButton {
  Button button = 1;
  // Unspecified means TAP.
  Action action = 2;
  // Taps in a row, e.g. 2 for a double click; 0 means 1.
  uint32 count = 3;
}

// Wheel clicks; positive dy scrolls down, positive dx scrolls right.
message Scroll {
  int32 dx = 1;
  int32 dy = 2;
}

// A key or chord such as "Return", "ctrl+l" or "ctrl+shift+Tab", by X keysym
// name. Modifiers are pressed in order and released in reverse.
message Key {
  string keys = 1;
  // Unspecified means TAP.
  Action action = 2;
  // Taps in a row; 0 means 1.
  uint32 count = 3;
}

// Types Unicode text, one character at a time.
message Text {
  string text = 1;
  // Pause between characters; 0 means none.
  uint32 delay_ms = 2;
}

message Delay {
  uint32 ms = 1;
}

message InputResult {
  // Pointer position after the batch.
  int32 cursor_x = 1;
  int32 cursor_y = 2;
}
